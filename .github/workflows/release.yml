name: Release

# A tag vX.Y.Z matching rs/Cargo.toml builds, releases, and publishes to npm and
# the Homebrew tap. Every job can be re-run; whatever is already out is skipped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, native: true }
          - { target: x86_64-apple-darwin, os: macos-latest, native: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, native: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches rs/Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rs/Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but rs/Cargo.toml is $version"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: rs
      - if: matrix.native
        run: |
          bin="rs/target/${{ matrix.target }}/release/sharks"
          "$bin" -V && "$bin" -l | grep -q greathammer
      - name: Package
        run: |
          name="sharks-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "rs/target/${{ matrix.target }}/release/sharks" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
      - run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # Trusted publishing: npmjs.com trusts this workflow, so there is no token.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets && (cd assets && sha256sum -c SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$(npm view "ascii-sharks-term@$version" version 2>/dev/null)" = "$version" ]; then
            echo "ascii-sharks-term@$version is already on npm"
            exit 0
          fi
          scripts/npm-package.sh "$GITHUB_REF_NAME" assets pkg
          cd pkg && npm publish --access public

  # HOMEBREW_TAP_DEPLOY_KEY can write to anson1eechun/homebrew-tap only.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets && (cd assets && sha256sum -c SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
      - env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:anson1eechun/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/formula.sh "$GITHUB_REF_NAME" assets/SHA256SUMS > tap/Formula/sharks.rb
          cd tap
          git add Formula/sharks.rb
          if git diff --cached --quiet; then
            echo "formula already at $GITHUB_REF_NAME"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "sharks ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
