name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked

  # The Rust port must draw exactly what upstream's TypeScript draws.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
      - run: ./verify/verify.sh
