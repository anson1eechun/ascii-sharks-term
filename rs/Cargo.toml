[package]
name = "sharks"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "ASCII sharks and fish schools in your terminal (port of stackedlol/ascii-sharks)"
repository = "https://github.com/anson1eechun/ascii-sharks-term"
keywords = ["ascii", "terminal", "animation", "screensaver", "shark"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
